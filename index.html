<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼貼筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#23262E;
    --ink-2:#2B303A;
    --paper:#F6F1E6;
    --paper-dim:#EDE6D5;
    --ink-text:#2B2620;
    --paper-text:#EDE8DC;
    --paper-text-dim:#B9B4A6;
    --jade:#4B7A6C;
    --plum:#6B4A63;
    --brass:#C9A227;
    --rose:#A9667A;
    --slate:#5B6B79;
    --moss:#748B57;
    --ochre:#B5793A;
    --lilac:#7C6A96;
    --danger:#B24C3F;
    --radius:14px;
    --shadow: 0 8px 24px rgba(0,0,0,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(255,255,255,0.025), transparent 45%);
    color:var(--paper-text);
    font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    display:none;
    max-width:720px;
    margin:0 auto;
    padding:0 0 96px;
    min-height:100vh;
  }

  #lockOverlay{
    position:fixed; inset:0;
    background:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .lock-card{
    background:var(--paper);
    color:var(--ink-text);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:32px 26px;
    max-width:320px;
    width:100%;
    text-align:center;
  }
  .lock-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--brass);
    text-transform:uppercase;
    margin:0 0 8px;
  }
  .lock-title{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:20px;
    margin:0 0 20px;
    color:var(--ink-text);
  }
  .lock-input{
    width:100%;
    border:1px solid rgba(43,38,32,0.18);
    background:#fff;
    border-radius:10px;
    padding:11px 14px;
    font-size:15px;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink-text);
    outline:none;
    margin-bottom:12px;
    text-align:center;
  }
  .lock-input:focus{border-color:var(--jade);}
  .lock-btn{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    background:var(--jade);
    color:#fff;
    font-size:14px;
    font-weight:600;
    font-family:'Noto Sans TC', sans-serif;
    cursor:pointer;
  }
  .lock-error{
    color:var(--danger);
    font-size:12.5px;
    margin-top:10px;
  }

  header{
    padding:28px 20px 18px;
    border-bottom:1px solid rgba(237,232,220,0.1);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--brass);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:28px;
    margin:0 0 4px;
    color:var(--paper-text);
    letter-spacing:0.02em;
  }
  .sub{
    font-size:13px;
    color:var(--paper-text-dim);
    margin:0 0 18px;
  }
  .search-wrap{
    position:relative;
  }
  #search{
    width:100%;
    background:rgba(237,232,220,0.06);
    border:1px solid rgba(237,232,220,0.14);
    border-radius:10px;
    padding:11px 14px;
    color:var(--paper-text);
    font-size:14px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s;
  }
  #search::placeholder{color:var(--paper-text-dim);}
  #search:focus{border-color:var(--brass);}
  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    font-size:12px;
    color:var(--paper-text-dim);
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--brass);
    font-size:12px;
    font-family:'IBM Plex Mono', monospace;
    cursor:pointer;
    padding:4px 0;
  }
  .link-btn:hover{text-decoration:underline;}

  .tagrow{
    display:flex;
    gap:8px;
    padding:14px 20px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tagrow::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    padding:7px 13px;
    border-radius:999px;
    border:1px solid rgba(237,232,220,0.18);
    background:rgba(237,232,220,0.04);
    color:var(--paper-text-dim);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s;
    user-select:none;
  }
  .chip[data-active="true"]{
    background:var(--brass);
    border-color:var(--brass);
    color:#23262E;
    font-weight:600;
  }
  .chip:focus-visible{outline:2px solid var(--brass); outline-offset:2px;}

  #list{
    padding:6px 20px 20px;
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  @media (min-width:560px){
    #list{grid-template-columns:1fr 1fr;}
  }
  .card{
    background:var(--paper);
    color:var(--ink-text);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px 14px 16px;
    position:relative;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .card:active{transform:scale(0.985);}
  .pin{
    position:absolute;
    top:-6px;
    left:18px;
    width:11px;
    height:11px;
    border-radius:50%;
    box-shadow:0 2px 3px rgba(0,0,0,0.35);
    border:2px solid rgba(0,0,0,0.15);
  }
  .thumb-wrap{
    background:#fff;
    padding:6px 6px 0;
    border-radius:6px 6px 2px 2px;
    box-shadow:0 3px 8px rgba(0,0,0,0.18);
    margin-bottom:12px;
  }
  .thumb{
    width:100%;
    display:block;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:3px 3px 0 0;
  }
  .thumb-caption{height:14px;}
  .card-title{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:16px;
    line-height:1.4;
    margin:0 0 8px;
    padding-right:6px;
  }
  .tags-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .tag-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    padding:3px 9px;
    border-radius:999px;
    color:#fff;
    letter-spacing:0.02em;
  }
  .note{
    font-size:13px;
    line-height:1.6;
    color:#4A4438;
    margin:0 0 8px;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-link{
    font-size:12px;
    color:var(--jade);
    text-decoration:none;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:4px;
  }
  .card-link:hover{text-decoration:underline;}

  .empty{
    padding:60px 30px;
    text-align:center;
    color:var(--paper-text-dim);
  }
  .empty .glyph{font-size:34px; margin-bottom:10px; opacity:0.6;}
  .empty p{font-size:14px; line-height:1.7; margin:0;}

  #fab{
    position:fixed;
    right:20px;
    bottom:24px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--brass);
    color:#23262E;
    border:none;
    font-size:26px;
    font-weight:600;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
    transition:transform .12s;
  }
  #fab:active{transform:scale(0.92);}
  #fab:focus-visible{outline:2px solid #fff; outline-offset:3px;}

  #overlay{
    position:fixed; inset:0;
    background:rgba(15,16,20,0.6);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s;
    z-index:30;
  }
  #overlay[data-open="true"]{opacity:1; pointer-events:auto;}
  #sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:720px;
    margin:0 auto;
    background:var(--paper);
    color:var(--ink-text);
    border-radius:20px 20px 0 0;
    padding:18px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
    transform:translateY(100%);
    transition:transform .22s ease;
    z-index:31;
  }
  #overlay[data-open="true"] #sheet{transform:translateY(0);}
  .sheet-handle{
    width:36px; height:4px; background:rgba(43,38,32,0.2);
    border-radius:99px; margin:0 auto 16px;
  }
  .sheet-title{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:19px;
    margin:0 0 16px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:#7A7263;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .field input[type=text], .field input[type=url], .field textarea{
    width:100%;
    border:1px solid rgba(43,38,32,0.18);
    background:#fff;
    border-radius:10px;
    padding:10px 12px;
    font-size:14px;
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink-text);
    outline:none;
    resize:vertical;
  }
  .field input:focus, .field textarea:focus{border-color:var(--jade);}
  .field textarea{min-height:70px;}
  .hint{font-size:11.5px; color:#9A927E; margin-top:5px;}
  .tag-picker{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
  .tag-toggle{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid rgba(43,38,32,0.18);
    background:#fff;
    color:#5A5344;
    cursor:pointer;
  }
  .tag-toggle[data-on="true"]{
    color:#fff;
    border-color:transparent;
  }
  .tag-add-row{display:flex; gap:8px;}
  .tag-add-row input{flex:1;}
  .tag-add-row button{
    flex:0 0 auto;
    border:1px solid rgba(43,38,32,0.18);
    background:#fff;
    border-radius:10px;
    padding:0 16px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink-text);
  }
  .preview-thumb{
    margin-top:8px;
    width:100%;
    max-height:160px;
    object-fit:cover;
    border-radius:8px;
    display:none;
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:none;
    font-size:14px;
    font-weight:600;
    font-family:'Noto Sans TC', sans-serif;
    cursor:pointer;
  }
  .btn-primary{background:var(--jade); color:#fff;}
  .btn-ghost{background:transparent; border:1px solid rgba(43,38,32,0.2); color:var(--ink-text);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid rgba(178,76,63,0.35);}

  .toast{
    position:fixed;
    top:16px; left:50%;
    transform:translateX(-50%) translateY(-140%);
    background:#23262E;
    color:var(--paper-text);
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    box-shadow:var(--shadow);
    transition:transform .22s ease;
    z-index:50;
    max-width:80%;
    text-align:center;
  }
  .toast[data-show="true"]{transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div id="lockOverlay">
  <div class="lock-card">
    <p class="lock-eyebrow">私人筆記</p>
    <h1 class="lock-title">請輸入密碼</h1>
    <input type="password" id="lockInput" class="lock-input" placeholder="密碼" autocomplete="off">
    <button type="button" id="lockSubmit" class="lock-btn">解鎖</button>
    <p class="lock-error" id="lockError" style="display:none;">密碼不對，再試一次</p>
  </div>
</div>

<div id="app">
  <header>
    <p class="eyebrow">naveenaa · 持續累積</p>
    <h1>拼貼筆記</h1>
    <p class="sub">參考資料、想買的、想存的、食譜——什麼都放得進來</p>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="搜尋標題或筆記內容…" autocomplete="off">
    </div>
    <div class="meta-row">
      <span id="countLabel"></span>
      <button type="button" id="exportBtn" class="link-btn">⤓ 匯出備份檔</button>
    </div>
  </header>

  <div class="tagrow" id="tagrow"></div>

  <div id="list"></div>

  <button id="fab" aria-label="新增一則">+</button>
</div>

<div id="overlay">
  <div id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title" id="sheetTitle">新增一則</h2>

    <div class="field">
      <label for="f-title">標題</label>
      <input type="text" id="f-title" placeholder="這是什麼？">
    </div>

    <div class="field">
      <label>分類標籤</label>
      <div class="tag-picker" id="tagPicker"></div>
      <div class="tag-add-row">
        <input type="text" id="f-newtag" placeholder="輸入新標籤，按新增">
        <button type="button" id="addTagBtn">新增</button>
      </div>
    </div>

    <div class="field">
      <label for="f-note">簡短筆記</label>
      <textarea id="f-note" placeholder="幾句話記下重點、原因、或你的想法"></textarea>
    </div>

    <div class="field">
      <label for="f-image">代表圖網址（選填）</label>
      <input type="url" id="f-image" placeholder="貼上圖片連結">
      <img id="previewThumb" class="preview-thumb" alt="">
    </div>

    <div class="field">
      <label for="f-link">來源連結（選填）</label>
      <input type="url" id="f-link" placeholder="https://…">
    </div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelBtn">取消</button>
      <button class="btn btn-primary" id="saveBtn">儲存</button>
    </div>
    <div class="sheet-actions" id="deleteRow" style="display:none;">
      <button class="btn btn-danger" id="deleteBtn">刪除這一則</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  var db = firebase.database();
  var dataRef = db.ref('data');
  var SHEET_URL = 'https://script.google.com/macros/s/AKfycbyNFe4wSHH938DrkfDTS7M5aC-xVM_jTv913p13RTDLNjFm9E_ba30rQqtDsBldeyjG/exec';

  var entries = [];
  var deletedSeedsList = [];
  var activeTag = null;
  var searchTerm = '';
  var sheetMode = 'add';
  var editingId = null;
  var sheetSelectedTags = new Set();

  var $ = function(sel){ return document.querySelector(sel); };
  var list = $('#list');
  var tagrow = $('#tagrow');
  var overlay = $('#overlay');
  var toastEl = $('#toast');

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  function hashStr(s){
    var h = 0;
    for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function tagColor(tag){
    return PALETTE[hashStr(tag) % PALETTE.length].hex;
  }
  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  }
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.setAttribute('data-show','true');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.removeAttribute('data-show'); }, 2200);
  }

  function migrateLocalStorage(){
    var stored = localStorage.getItem(STORAGE_KEY);
    var local = [];
    try { if(stored) local = JSON.parse(stored); } catch(e){}
    var deletedRaw = localStorage.getItem(DELETED_SEEDS_KEY);
    var deleted = [];
    try { if(deletedRaw) deleted = JSON.parse(deletedRaw); } catch(e){}

    var updates = {};
    var hasData = false;
    local.forEach(function(e){
      if(e && e.id && e.id.indexOf('seed-') !== 0){
        updates['entries/' + e.id] = e;
        hasData = true;
      }
    });
    if(deleted.length){ updates['deletedSeeds'] = deleted; hasData = true; }
    if(hasData){
      dataRef.update(updates).then(function(){
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(DELETED_SEEDS_KEY);
      });
    } else {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(DELETED_SEEDS_KEY);
    }
  }

  var syncStarted = false;
  function startSync(){
    dataRef.on('value', function(snap){
      var data = snap.val() || {};

      if(!syncStarted){
        syncStarted = true;
        var hasLocal = !!(localStorage.getItem(STORAGE_KEY));
        if(hasLocal && !snap.exists()){
          migrateLocalStorage();
          return;
        }
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(DELETED_SEEDS_KEY);
      }

      var storedObj = data.entries || {};
      var stored = [];
      Object.keys(storedObj).forEach(function(k){ if(storedObj[k]) stored.push(storedObj[k]); });
      deletedSeedsList = data.deletedSeeds || [];
      if(!Array.isArray(deletedSeedsList)) deletedSeedsList = Object.values(deletedSeedsList);

      var deletedIds = {};
      deletedSeedsList.forEach(function(id){ deletedIds[id] = true; });

      var seedMap = {};
      SEED_ENTRIES.forEach(function(s){ seedMap[s.id] = s; });

      var seenSeedIds = {};
      var merged = stored
        .filter(function(e){ return e && !deletedIds[e.id]; })
        .map(function(e){
          if(seedMap[e.id]){
            seenSeedIds[e.id] = true;
            return seedMap[e.id];
          }
          return e;
        });

      SEED_ENTRIES.forEach(function(s){
        if(!seenSeedIds[s.id] && !deletedIds[s.id]) merged.push(s);
      });

      entries = merged;
      render();
      debouncedSheetSync();
    });
  }

  var sheetSyncTimer = null;
  function debouncedSheetSync(){
    clearTimeout(sheetSyncTimer);
    sheetSyncTimer = setTimeout(syncToSheet, 2000);
  }
  function syncToSheet(){
    if(!SHEET_URL || !entries.length) return;
    fetch(SHEET_URL, {
      method: 'POST',
      body: JSON.stringify({ entries: entries }),
      mode: 'no-cors'
    }).catch(function(){});
  }

  function allTags(){
    var set = {};
    DEFAULT_TAGS.forEach(function(t){ set[t] = true; });
    entries.forEach(function(e){ (e.tags||[]).forEach(function(t){ set[t] = true; }); });
    return Object.keys(set);
  }

  function renderTagRow(){
    var tags = allTags();
    tagrow.innerHTML = '';
    var allChip = document.createElement('div');
    allChip.className = 'chip';
    allChip.textContent = '全部';
    allChip.dataset.active = (activeTag === null) ? 'true' : 'false';
    allChip.tabIndex = 0;
    allChip.addEventListener('click', function(){ activeTag = null; render(); });
    tagrow.appendChild(allChip);

    tags.forEach(function(tag){
      var chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = tag;
      chip.dataset.active = (activeTag === tag) ? 'true' : 'false';
      chip.tabIndex = 0;
      chip.addEventListener('click', function(){ activeTag = (activeTag === tag) ? null : tag; render(); });
      tagrow.appendChild(chip);
    });
  }

  function filteredEntries(){
    return entries
      .filter(function(e){ return !activeTag || (e.tags||[]).indexOf(activeTag) > -1; })
      .filter(function(e){
        if(!searchTerm) return true;
        var hay = (e.title + ' ' + e.note).toLowerCase();
        return hay.indexOf(searchTerm.toLowerCase()) > -1;
      })
      .sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); });
  }

  function renderList(){
    var items = filteredEntries();
    if(items.length === 0){
      list.innerHTML = '<div class="empty" style="grid-column:1/-1;">' +
        '<div class="glyph">◆</div>' +
        '<p>' + (entries.length === 0 ? '還沒有任何紀錄，點右下角開始新增' : '這個分類目前沒有東西') + '</p></div>';
      return;
    }
    list.innerHTML = items.map(function(e){
      var pinColor = tagColor((e.tags && e.tags[0]) || 'default');
      var thumb = e.image ? '<div class="thumb-wrap">' +
        '<img class="thumb" src="' + escapeHtml(e.image) + '" loading="lazy" onerror="this.parentElement.style.display=\'none\'" alt="">' +
        '<div class="thumb-caption"></div></div>' : '';
      var tagsHtml = (e.tags||[]).map(function(t){ return '<span class="tag-pill" style="background:' + tagColor(t) + '">' + escapeHtml(t) + '</span>'; }).join('');
      var linkHtml = e.link ? '<a class="card-link" href="' + escapeHtml(e.link) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">前往連結 ↗</a>' : '';
      return '<div class="card" data-id="' + e.id + '">' +
        '<div class="pin" style="background:' + pinColor + '"></div>' +
        thumb +
        '<div class="card-title">' + escapeHtml(e.title) + '</div>' +
        '<div class="tags-row">' + tagsHtml + '</div>' +
        (e.note ? '<div class="note">' + escapeHtml(e.note) + '</div>' : '') +
        linkHtml + '</div>';
    }).join('');

    list.querySelectorAll('.card').forEach(function(card){
      card.addEventListener('click', function(){ openSheet('edit', card.dataset.id); });
    });
  }

  function render(){
    renderTagRow();
    renderList();
    $('#countLabel').textContent = entries.length ? '共 ' + entries.length + ' 則' : '';
  }

  function renderTagPicker(){
    var picker = $('#tagPicker');
    picker.innerHTML = '';
    allTags().forEach(function(tag){
      var btn = document.createElement('div');
      btn.className = 'tag-toggle';
      btn.textContent = tag;
      var on = sheetSelectedTags.has(tag);
      btn.dataset.on = on ? 'true' : 'false';
      if(on) btn.style.background = tagColor(tag);
      btn.addEventListener('click', function(){
        if(sheetSelectedTags.has(tag)) sheetSelectedTags.delete(tag);
        else sheetSelectedTags.add(tag);
        renderTagPicker();
      });
      picker.appendChild(btn);
    });
  }

  function openSheet(mode, id){
    sheetMode = mode;
    editingId = id || null;
    var entry = id ? entries.find(function(e){ return e.id === id; }) : null;

    $('#sheetTitle').textContent = mode === 'edit' ? '編輯這一則' : '新增一則';
    $('#f-title').value = entry ? entry.title : '';
    $('#f-note').value = entry ? entry.note : '';
    $('#f-image').value = entry ? (entry.image || '') : '';
    $('#f-link').value = entry ? (entry.link || '') : '';
    $('#f-newtag').value = '';
    sheetSelectedTags = new Set(entry ? (entry.tags||[]) : []);
    renderTagPicker();
    updatePreview();

    $('#deleteRow').style.display = mode === 'edit' ? 'flex' : 'none';
    overlay.dataset.open = 'true';
    setTimeout(function(){ $('#f-title').focus(); }, 200);
  }

  function closeSheet(){
    overlay.dataset.open = 'false';
  }

  function updatePreview(){
    var url = $('#f-image').value.trim();
    var img = $('#previewThumb');
    if(!url){ img.style.display = 'none'; return; }
    img.onerror = function(){ img.style.display = 'none'; };
    img.onload = function(){ img.style.display = 'block'; };
    img.src = url;
  }

  function saveEntry(){
    var title = $('#f-title').value.trim();
    if(!title){ showToast('請先填標題'); $('#f-title').focus(); return; }
    var note = $('#f-note').value.trim();
    var image = $('#f-image').value.trim();
    var link = $('#f-link').value.trim();
    var tags = Array.from(sheetSelectedTags);

    if(sheetMode === 'edit' && editingId){
      var existing = entries.find(function(e){ return e.id === editingId; });
      var updated = Object.assign({}, existing, {title:title, note:note, image:image, link:link, tags:tags});
      dataRef.child('entries/' + editingId).set(updated);
    } else {
      var id = uid();
      dataRef.child('entries/' + id).set({
        id:id, title:title, note:note, image:image, link:link, tags:tags,
        createdAt: new Date().toISOString()
      });
    }
    closeSheet();
    showToast('已儲存');
  }

  function deleteEntry(){
    if(!editingId) return;
    if(!confirm('確定要刪除這一則嗎？')) return;
    var updates = {};
    updates['entries/' + editingId] = null;
    if(editingId.indexOf('seed-') === 0){
      deletedSeedsList.push(editingId);
      updates['deletedSeeds'] = deletedSeedsList;
    }
    dataRef.update(updates);
    closeSheet();
    showToast('已刪除');
  }

  function exportBackup(){
    if(entries.length === 0){ showToast('目前還沒有資料可以匯出'); return; }
    var sorted = entries.slice().sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); });
    var lines = ['# 拼貼筆記備份', '匯出時間：' + new Date().toLocaleString('zh-TW'), '共 ' + entries.length + ' 則', ''];
    sorted.forEach(function(e){
      lines.push('## ' + e.title);
      if(e.tags && e.tags.length) lines.push('標籤：' + e.tags.join('、'));
      if(e.note) lines.push('', e.note);
      if(e.image) lines.push('', '圖片：' + e.image);
      if(e.link) lines.push('連結：' + e.link);
      lines.push('', '---', '');
    });
    var blob = new Blob([lines.join('\n')], {type:'text/markdown;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '拼貼筆記備份-' + new Date().toISOString().slice(0,10) + '.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('備份檔已下載');
  }

  $('#exportBtn').addEventListener('click', exportBackup);
  $('#fab').addEventListener('click', function(){ openSheet('add', null); });
  $('#cancelBtn').addEventListener('click', closeSheet);
  $('#saveBtn').addEventListener('click', saveEntry);
  $('#deleteBtn').addEventListener('click', deleteEntry);
  overlay.addEventListener('click', function(ev){ if(ev.target === overlay) closeSheet(); });
  $('#f-image').addEventListener('input', updatePreview);
  $('#addTagBtn').addEventListener('click', addNewTagFromInput);
  $('#f-newtag').addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){ ev.preventDefault(); addNewTagFromInput(); }
  });
  function addNewTagFromInput(){
    var input = $('#f-newtag');
    var val = input.value.trim();
    if(!val) return;
    sheetSelectedTags.add(val);
    input.value = '';
    renderTagPicker();
  }
  $('#search').addEventListener('input', function(ev){
    searchTerm = ev.target.value;
    renderList();
  });

  var UNLOCK_KEY = 'naveenaa-unlocked';
  var PASS_HASH = '2aced65d6b9d7ac4c83a3115dfc24c56388964f1960bd3c96c5feb2f6776bd1f';

  function sha256Hex(str){
    var enc = new TextEncoder().encode(str);
    return crypto.subtle.digest('SHA-256', enc).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    });
  }

  function unlockApp(){
    $('#lockOverlay').style.display = 'none';
    $('#app').style.display = 'block';
    startSync();
  }

  function initLock(){
    if(localStorage.getItem(UNLOCK_KEY) === '1'){
      unlockApp();
      return;
    }
    var input = $('#lockInput');
    var err = $('#lockError');
    function trySubmit(){
      var val = input.value;
      sha256Hex(val).then(function(hash){
        if(hash === PASS_HASH){
          localStorage.setItem(UNLOCK_KEY, '1');
          unlockApp();
        } else {
          err.style.display = 'block';
          input.value = '';
          input.focus();
        }
      });
    }
    $('#lockSubmit').addEventListener('click', trySubmit);
    input.addEventListener('keydown', function(ev){
      if(ev.key === 'Enter'){ ev.preventDefault(); trySubmit(); }
    });
    setTimeout(function(){ input.focus(); }, 100);
  }

  initLock();
})();
</script>
</body>
</html>
